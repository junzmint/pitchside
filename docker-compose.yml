name: pitchside

services:
  db:
    image: postgres:16-alpine
    # CPU weight (Docker's default is 1024): when other work keeps the computer's cores busy, the game's requests
    # still get their share. It only matters while the game is busy; idle, it takes nothing from anyone.
    cpu_shares: 4096
    shm_size: 256mb # Postgres' parallel workers share memory through /dev/shm (Docker's default 64 MB is too small)
    # The game's database is small and read on every request: room to keep all of it in memory, and no parallel
    # query workers (starting one costs more than the small queries they would split)
    command: postgres -c shared_buffers=256MB -c effective_cache_size=1GB -c max_parallel_workers_per_gather=0
    environment:
      POSTGRES_USER: pitch
      POSTGRES_PASSWORD: pitch
      POSTGRES_DB: pitchside
    ports:
      - "127.0.0.1:55432:5432" # this computer only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitch -d pitchside"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    cpu_shares: 4096 # (see db)
    environment:
      DATABASE_URL: postgres://pitch:pitch@db:5432/pitchside?sslmode=disable
      PORT: "8095"
      LAN_IP: ${LAN_IP:-} # set by `make up-lan`: the address other devices on the Wi-Fi open for LAN play
      AUTO_SEED: "1" # load backend/seed.json demo data the first time the database is empty
    ports:
      - "127.0.0.1:8095:8095" # this computer only (the web container reaches the API over Docker's own network)
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      # this computer only; `make up-lan` sets WEB_BIND=0.0.0.0 to open the game to devices on the same Wi-Fi
      - "${WEB_BIND:-127.0.0.1}:5195:80"
    depends_on:
      - api

volumes:
  pgdata:

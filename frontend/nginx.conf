server {
  listen 80;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;
  root /usr/share/nginx/html;
  # LAN play: WebSocket relay between the host's browser and a second device
  location /api/lan/ws {
    proxy_pass http://api:8095;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 4h;
    proxy_send_timeout 4h;
  }
  location /api/ {
    proxy_pass http://api:8095;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  # hashed bundles can be cached forever; index.html must always be re-checked so a rebuild shows up on reload
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # the web app manifest (Add to Home Screen): its own type, always re-checked
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

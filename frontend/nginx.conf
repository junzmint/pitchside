server {
  listen 80;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  gzip_min_length 1024;
  root /usr/share/nginx/html;
  # Look the API container up through Docker's DNS on every request (kept 5 s). A fixed `proxy_pass http://api:8095`
  # is looked up once at start, and a restarted API container can come back on another address (even the
  # database's), which left every /api call failing with 502 until this container was restarted too.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api http://api:8095;
  # LAN play: WebSocket relay between the host's browser and a second device
  location /api/lan/ws {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 4h;
    proxy_send_timeout 4h;
  }
  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  # hashed bundles can be cached forever; index.html must always be re-checked so a rebuild shows up on reload
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # the web app manifest (Add to Home Screen): its own type, always re-checked
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
